# ============================================================
# Pocket Empire v5.1 — wrangler.toml
# Architecture: Hono.js + Zod + Modular Services
# Entry: src/index.js
# ============================================================

name = "pocket-empire"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# ---------- D1 Database ----------
[[d1_databases]]
binding = "DB"
database_name = "pocket-empire-db"
database_id = "ab478d5b-d012-44e1-a1ca-71af8b202f9e"

# ---------- Workers AI ----------
[ai]
binding = "AI"

# ---------- KV Namespace ----------
# NOTE: Apna actual KV namespace ID yahan daalna (currently placeholder).
[[kv_namespaces]]
binding = "PE_KV"
id = "6675b10e8b614e1ab5e4f7661f94a07e"


# ----------queues.producers----------
[[queues.producers]]
binding = "PE_REPORTER"
queue = "pe-reporter"


# ---------- Queue Producers ----------
[[queues.producers]]
binding = "PE_COLLECTOR"
queue = "pe-collector"

[[queues.producers]]
binding = "PE_PROCESSOR"
queue = "pe-processor"

[[queues.producers]]
binding = "PE_PUBLISHER"
queue = "pe-publisher"

# ---------- Queue Consumers ----------
[[queues.consumers]]
queue = "pe-collector"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "pe-collector-dlq"

[[queues.consumers]]
queue = "pe-processor"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "pe-processor-dlq"

[[queues.consumers]]
queue = "pe-publisher"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "pe-publisher-dlq"

#_____________________logs___________________________
[observability]
enabled = true
head_sampling_rate = 1

[vars]
RSS_FEED_URL = "https://news.google.com/rss/search?q=stock+market+india&hl=en-IN&gl=IN&ceid=IN:en"
# ---------- Environment Variables ----------
# Secrets (MASTER_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, etc.) manually
# Cloudflare dashboard se ya `wrangler secret put` se daale jaayenge.
