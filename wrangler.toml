# ============================================================
# Pocket Empire v5.1 — wrangler.toml
# Architecture: Hono.js + Zod + Modular Services
# Entry: src/main.js
# ============================================================

name = "pocket-empire"
main = "src/main.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# ---------- D1 Database ----------
[[d1_databases]]
binding = "DB"
database_name = "pocket-empire-db"
database_id = "ab478d5b-d012-44e1-a1ca-71af8b202f9e"

# ---------- Workers AI ----------
[ai]
binding = "AI"

# ---------- KV Namespace ----------
# NOTE: Apna actual KV namespace ID yahan daalna (currently placeholder).
# Fast read/write (cache, tokens, admin profiles) ke liye D1 se behtar hai.
[[kv_namespaces]]
binding = "PE_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ---------- Queue Producers ----------
[[queues.producers]]
binding = "PE_COLLECTOR"
queue = "pe-collector"

[[queues.producers]]
binding = "PE_PROCESSOR"
queue = "pe-processor"

[[queues.producers]]
binding = "PE_PUBLISHER"
queue = "pe-publisher"

# ---------- Queue Consumers ----------
# NOTE: Pehle sirf "pe-processor" consumer tha. Collector aur Publisher
# queues ke liye bhi consumer chahiye, warna unme messages padhe hi nahi jaayenge.

[[queues.consumers]]
queue = "pe-collector"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "pe-collector-dlq"

[[queues.consumers]]
queue = "pe-processor"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "pe-processor-dlq"

[[queues.consumers]]
queue = "pe-publisher"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "pe-publisher-dlq"

# ---------- Environment Variables ----------
# ध्यान दें: [vars] aur sabhi khaali Secrets yahan se hata diya gaya hai.
# GitHub deployment Cloudflare dashboard ke secrets ko kabhi nahi mitayega.
# Secrets (MASTER_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, etc.) manually
# Cloudflare dashboard se ya `wrangler secret put` se daale jaayenge.
