# ============================================================
# Pocket Empire v5.1 — wrangler.toml
# Architecture: Hono.js + Zod + Modular Services
# Entry: src/main.js
# ============================================================

name = "pocket-empire"
main = "src/main.js"                     
compatibility_date = "2024-01-01"

# ---------- D1 Database ----------
[[d1_databases]]
binding = "DB"
database_name = "pocket-empire-db"
database_id = "ab478d5b-d012-44e1-a1ca-71af8b202f9e"

# ---------- Workers AI ----------
[ai]
binding = "AI"

# ---------- Queue Producers ----------
[[queues.producers]]
binding = "PE_COLLECTOR"
queue = "pe-collector"

[[queues.producers]]
binding = "PE_PROCESSOR"
queue = "pe-processor"

[[queues.producers]]
binding = "PE_PUBLISHER"
queue = "pe-publisher"

# ---------- Queue Consumer ----------
[[queues.consumers]]
queue = "pe-processor"
max_batch_size = 10

# ---------- Environment Variables ----------
# ध्यान दें: हमने [vars] और सभी खाली Secrets को यहाँ से हटा दिया है।
# अब GitHub डिप्लॉयमेंट आपके क्लाउडफ्लेयर डैशबोर्ड के सीक्रेट्स को कभी नहीं मिटाएगा।
